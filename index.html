<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Welcome Back</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="login-container">

    <div class="login-card">

      <!-- =========================================
           LEFT CHARACTER PANEL
           ========================================= -->

      <div class="illustration-panel">

        <div class="character-container" id="character-container">
          <!-- Characters are loaded by app.js -->
        </div>

      </div>


      <!-- =========================================
           RIGHT AUTH PANEL
           ========================================= -->

      <div class="form-panel">

        <div class="form-content">


          <!-- =====================================
               LOGO
               ===================================== -->

          <div class="logo-container">

            <svg width="34" height="28" viewBox="0 0 34 28" fill="none" xmlns="http://www.w3.org/2000/svg">

              <path
                d="M17 6C15 1 12 0 10 0C6 0 4 5 4 11C4 18 1 20 1 23C1 26 5 28 17 28C29 28 33 26 33 23C33 20 30 18 30 11C30 5 28 0 24 0C22 0 19 1 17 6Z"
                fill="#000000" />

            </svg>

          </div>


          <!-- =====================================
               SIGN IN / LOG IN SWITCH
               ===================================== -->

          <div class="auth-switch">

            <button type="button" id="signin-mode" class="auth-mode active">
              Sign in
            </button>

            <button type="button" id="login-mode" class="auth-mode">
              Log in
            </button>

          </div>


          <!-- =====================================
               HEADING
               ===================================== -->

          <h1 class="welcome-heading" id="auth-heading">
            Join us!
          </h1>

          <p class="welcome-subtext" id="auth-subtext">
            Create your account to get started
          </p>


          <!-- =====================================
               AUTHENTICATION FORM
               ===================================== -->

          <form id="login-form" autocomplete="on">


            <!-- EMAIL -->

            <div class="input-group">

              <label for="email" class="input-label">
                Email
              </label>

              <input type="email" id="email" name="email" class="form-input" required autocomplete="email">

            </div>


            <!-- PASSWORD -->

            <div class="input-group password-group">

              <label for="password" class="input-label">
                Password
              </label>

              <div class="password-wrapper">

                <input type="password" id="password" name="password" class="form-input" required
                  autocomplete="current-password">


                <!-- Password Visibility -->

                <button type="button" class="password-toggle" aria-label="Toggle password visibility">

                  <!-- Eye Off -->

                  <svg class="eye-icon eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">

                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                    </path>

                    <line x1="1" y1="1" x2="23" y2="23"></line>

                  </svg>


                  <!-- Eye On -->

                  <svg class="eye-icon eye-on hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>

                    <circle cx="12" cy="12" r="3"></circle>

                  </svg>

                </button>

              </div>

            </div>


            <!-- =====================================
                 CONFIRM PASSWORD
                 ONLY FOR SIGN IN
                 ===================================== -->

            <div class="input-group confirm-password-group" id="confirm-password-group">

              <label for="confirm-password" class="input-label">
                Confirm Password
              </label>

              <input type="password" id="confirm-password" name="confirm-password" class="form-input"
                autocomplete="new-password">

            </div>


            <!-- =====================================
                 REMEMBER ME / FORGOT PASSWORD
                 ===================================== -->

            <div class="form-options">


              <!-- Remember Me -->

              <label class="remember-me">

                <input type="checkbox" id="remember" name="remember" checked>

                <span class="custom-checkbox">

                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round">

                    <polyline points="20 6 9 17 4 12"></polyline>

                  </svg>

                </span>

                <span class="checkbox-label">
                  Remember me
                </span>

              </label>


              <!-- Forgot Password -->

              <a href="#" class="forgot-link">
                Forget password?
              </a>

            </div>


            <!-- =====================================
                 ACTION BUTTONS
                 ===================================== -->

            <div class="form-actions">


              <!-- Main Authentication Button -->

              <button type="submit" class="btn btn-primary" id="auth-submit">
                Sign in
              </button>


              <!-- Google Login -->

              <button type="button" class="btn btn-secondary btn-google">

                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">

                  <path
                    d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.47h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.91c1.7-1.56 2.69-3.86 2.69-6.6Z"
                    fill="#4285F4" />

                  <path d="M9 18c2.43 0 4.47-.8 5.96-2.2l-2.91-2.26a5.41 5.41 0 0 1-8.09-3.04H.93v2.33A9 9 0 0 0 9 18Z"
                    fill="#34A853" />

                  <path d="M3.96 10.5a5.4 5.4 0 0 1 0-3.42V4.75H.93a9 9 0 0 0 0 8.5L3.96 10.5Z" fill="#FBBC05" />

                  <path d="M9 3.58c1.32 0 2.5.45 3.44 1.35L15 2.4A9 9 0 0 0 .93 4.75l3.03 2.33A5.41 5.41 0 0 1 9 3.58Z"
                    fill="#EA4335" />

                </svg>

                <span>
                  Log in with Google
                </span>

              </button>

            </div>

          </form>


          <!-- =====================================
               BOTTOM SWITCH
               ===================================== -->

          <p class="form-footer" id="auth-footer">

            Already have an account?

            <a href="#" class="signup-link" id="footer-login">
              Log in
            </a>

          </p>


        </div>

      </div>

    </div>

  </div>


  <!-- =========================================
       APP JAVASCRIPT
       ========================================= -->

  <script src="app.js"></script>

</body>

</html>
