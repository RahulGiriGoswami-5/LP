<svg viewBox="0 0 95 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue Circular Character -->
  <g id="blue-character">
    <!-- Legs -->
    <g id="legs">
      <rect id="leg-1" x="30" y="80" width="11" height="75" rx="5.5" fill="#2c8cf4" />
      <rect id="leg-2" x="52" y="80" width="11" height="75" rx="5.5" fill="#2c8cf4" />
    </g>
    
    <!-- Body -->
    <circle id="body" cx="46" cy="45" r="42" fill="#2c8cf4" />
    
    <!-- Eyes -->
    <g id="eyes">
      <!-- Left Eye -->
      <g id="eye-left">
        <circle id="eye-white-left" cx="32" cy="28" r="10" fill="#ffffff" />
        <circle id="pupil-left" cx="29" cy="25" r="4" fill="#1a1a1a" />
      </g>
      <!-- Right Eye -->
      <g id="eye-right">
        <circle id="eye-white-right" cx="50" cy="28" r="10" fill="#ffffff" />
        <circle id="pupil-right" cx="47" cy="25" r="4" fill="#1a1a1a" />
      </g>
    </g>
    
    <!-- Mouth -->
    <g id="mouth">
      <circle id="mouth-bg" cx="40" cy="58" r="12" fill="#10477d" />
      <!-- Tooth -->
      <rect id="tooth" x="37" y="46" width="6" height="5" rx="0.5" fill="#ffffff" />
    </g>
  </g>
</svg>
